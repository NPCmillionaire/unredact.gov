# docker compose up -d   →  web on :8000, plus a daily FOIA tick (poll replies, chase overdue requests)
services:
  web:
    build: .
    env_file: .env
    volumes: [unredact-data:/data]
    ports: ["127.0.0.1:8000:8000"]   # put Caddy/nginx in front for TLS
    restart: unless-stopped

  tick:
    build: .
    env_file: .env
    volumes: [unredact-data:/data]
    command: ["sh", "-c", "unredact congress sync || true; while true; do unredact foia tick --send; sleep 86400; done"]
    restart: unless-stopped

volumes:
  unredact-data:
