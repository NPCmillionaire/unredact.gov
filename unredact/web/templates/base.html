<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}unredact.me{% endblock %}</title>
{% block head %}{% endblock %}
<style>
  :root { --fg:#16181d; --muted:#5d6472; --line:#e3e5ea; --bg:#fbfbfc; --accent:#b4231f; --ok:#1d7a46; --warn:#a46500; }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--fg); background:var(--bg); }
  header { border-bottom:1px solid var(--line); background:#fff; }
  header .wrap { display:flex; align-items:center; gap:24px; padding:14px 20px; }
  header a.brand { font-weight:700; letter-spacing:.02em; color:var(--accent); text-decoration:none; font-size:18px; }
  header nav a { color:var(--muted); text-decoration:none; margin-right:16px; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 20px; }
  h1 { font-size: 26px; margin: 0 0 8px; } h2 { font-size: 18px; margin: 28px 0 10px; }
  p.lead { color: var(--muted); margin-top: 0; }
  label { display:block; font-weight:600; font-size:13px; margin:14px 0 4px; }
  input[type=text], input[type=email], input[type=tel], input[type=number], select, textarea {
    width:100%; padding:9px 10px; border:1px solid #cfd3da; border-radius:6px; font:inherit; background:#fff; }
  textarea { min-height: 200px; }
  .row { display:grid; grid-template-columns: 110px 1fr 1fr; gap:12px; }
  .row2 { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  button, .btn { display:inline-block; background:var(--accent); color:#fff; border:0; border-radius:6px; padding:10px 18px;
    font:inherit; font-weight:600; cursor:pointer; text-decoration:none; margin-top:18px; }
  .btn.secondary, button.secondary { background:#fff; color:var(--fg); border:1px solid #cfd3da; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin:12px 0; }
  .error { background:#fdecea; border:1px solid #f3c2bd; color:#8a1c14; padding:10px 14px; border-radius:6px; }
  .note { background:#f3f6fb; border:1px solid #dce4f0; padding:10px 14px; border-radius:6px; color:#2b3a52; }
  pre { white-space: pre-wrap; font: 13px/1.5 ui-monospace, Menlo, monospace; background:#f6f7f9; padding:12px; border-radius:6px; }
  table { width:100%; border-collapse: collapse; background:#fff; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); font-size:14px; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; font-weight:600; background:#eef0f3; }
  .pill.sent, .pill.complete { background:#e3f4ea; color:var(--ok); }
  .pill.failed, .pill.denied { background:#fdecea; color:var(--accent); }
  .pill.manual, .pill.needs_human, .pill.overdue, .pill.awaiting_payment { background:#fff3dd; color:var(--warn); }
  .muted { color: var(--muted); font-size: 13px; }
  .check { display:flex; gap:8px; align-items:flex-start; font-weight:400; }
  .check input { margin-top: 4px; }
  button.linkish { background:none; color:var(--muted); padding:0; margin:0 0 0 8px; font-weight:400; text-decoration:underline; }
  input[type=password] { width:100%; padding:9px 10px; border:1px solid #cfd3da; border-radius:6px; font:inherit; background:#fff; }
  .grid3 { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:12px; }
  .pill.leak { background:#fdecea; color:var(--accent); }
  .pill.ripe { background:#fdecea; color:var(--accent); }
  details summary { cursor:pointer; font-weight:600; }
</style>
</head>
<body>
<header><div class="wrap" style="padding:14px 20px">
  <a class="brand" href="/">unredact<span style="color:var(--fg)">.me</span></a>
  <nav style="flex:1"><a href="/foia">My requests</a><a href="/congress">Write Congress</a></nav>
  {% if user %}<span class="muted">{{ user.email }}</span> <a class="muted" href="/account">account</a>
    <form method="post" action="/logout" style="display:inline;margin:0"><button class="linkish" type="submit">log out</button></form>
  {% else %}<a href="/login">Log in</a> <a class="btn" style="margin:0;padding:6px 14px" href="/signup">Sign up</a>{% endif %}
</div></header>
<main class="wrap">
{% block body %}{% endblock %}
</main>
</body>
</html>
