[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redtape"
version = "0.1.0"
description = "Automate FOIA/public-records requests and constituent messages to Congress (CWC, web forms, email, paid postal letters)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cameron R. Preston" }]
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pyyaml>=6",
  "python-dotenv>=1.0",
  "holidays>=0.50",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "stripe>=8",
]

[project.optional-dependencies]
webforms = ["playwright>=1.44"]
dev = ["pytest>=8"]

[project.scripts]
redtape = "redtape.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["redtape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
